name: Scoring snapshot

on:
  schedule:
    # Weekdays at 21:30 UTC (~30 min after US market close).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Optional universe to restrict the run (e.g. stocks)"
        required: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Run scorer
        run: |
          if [ -n "${{ inputs.universe }}" ]; then
            python -m scoring.runner --universe "${{ inputs.universe }}"
          else
            python -m scoring.runner
          fi
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "[scoring] $(date -u +%Y-%m-%d)"
          git push
