name: Scoring snapshot

# Run weekdays (Mon-Fri, UTC-declared) at two windows to guarantee a fresh
# post-US-close snapshot all year:
#   - 21:30 UTC → 17:30 ET during EDT / 16:30 ET during EST
#   - 22:30 UTC → 18:30 ET during EDT / 17:30 ET during EST
# Either run writes to public/data/; the later run is idempotent-ish — if
# nothing changed, the "Commit snapshots" step no-ops.
#
# Traders expect data within 1-2 hours of the 16:00 ET cash close; the two
# windows cover both DST states. Manual dispatch remains available.

on:
  schedule:
    - cron: "30 21 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Optional universe to restrict the run (e.g. stocks)"
        required: false

permissions:
  contents: write

concurrency:
  group: scoring-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[market]'
      - name: Run scorer
        run: |
          if [ -n "${{ inputs.universe }}" ]; then
            python -m scoring.runner --universe "${{ inputs.universe }}"
          else
            python -m scoring.runner
          fi
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "[scoring] $(date -u +%Y-%m-%d)"
          git push
