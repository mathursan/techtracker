name: Scoring snapshot

# Schedule intentionally DISABLED until issue #3 replaces the placeholder
# scorer with real indicator logic. Leaving only `workflow_dispatch` prevents
# `placeholder: true` data from being auto-committed to main on weekdays.
# Re-enable (and finalize the UTC/ET window) as part of #3.
#
# on:
#   schedule:
#     - cron: "0 21 * * 1-5"   # 17:00 ET during standard time / 16:00 during DST

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Optional universe to restrict the run (e.g. stocks)"
        required: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Run scorer
        run: |
          if [ -n "${{ inputs.universe }}" ]; then
            python -m scoring.runner --universe "${{ inputs.universe }}"
          else
            python -m scoring.runner
          fi
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "[scoring] $(date -u +%Y-%m-%d)"
          git push
